# Règles detekt du projet, par-dessus la configuration par défaut. Le formatage et la longueur des lignes
# sont l'affaire de ktlint (spotless) : on ne les vérifie pas deux fois.
style:
  MaxLineLength:
    active: false
  MagicNumber:
    excludes: ['**/test/**']
    # Les nombres passés à une énumération sont des codes stables (identifiants de la banque d'attentions), pas des
    # nombres magiques.
    ignoreEnums: true
naming:
  FunctionNaming:
    excludes: ['**/test/**']
