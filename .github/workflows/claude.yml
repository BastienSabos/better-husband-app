# Claude répond quand on le mentionne (@claude) dans une issue, une PR ou une revue.
# Prérequis : secret CLAUDE_CODE_OAUTH_TOKEN ou ANTHROPIC_API_KEY (voir docs/ai-harness.md).
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Seul le propriétaire du dépôt peut déclencher Claude.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.author_association == 'OWNER') ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check Claude credentials
        id: auth
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ] || [ -n "$API_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::Aucun secret Claude configuré, étape ignorée (voir docs/ai-harness.md)."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v5
        if: steps.auth.outputs.ok == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        if: steps.auth.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.auth.outputs.ok == 'true'
        with:
          cache-read-only: true

      - uses: anthropics/claude-code-action@v1
        if: steps.auth.outputs.ok == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          claude_args: |
            --allowedTools "Bash(./gradlew:*),Bash(git:*),Read,Edit,Write,Glob,Grep"
