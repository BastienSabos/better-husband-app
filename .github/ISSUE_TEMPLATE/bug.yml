name: Bug
description: Un comportement incorrect
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Attendu / obtenu
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Appareil, version Android, version de l'app
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Retirer toute donnée personnelle avant de coller.
      render: text
